name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Verifica versione
        run: |
          $tag = '${{ github.ref_name }}'
          $modVersion = (Get-Content ModInfo.json -Raw | ConvertFrom-Json).modVersion
          if ($tag.TrimStart('v') -ne $modVersion) {
            throw "Il tag $tag non corrisponde a modVersion $modVersion in ModInfo.json"
          }

      - name: Build
        run: ./build.ps1 -Zip

      - name: Crea release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "dist/StoneCutterOutput-$tag.zip"
          Move-Item dist/StoneCutterOutput.zip $zip
          $notes = @'
          Estrai lo zip in `Documenti\Foxy Voxel\Going Medieval\Mods`, poi abilita la mod dal menu **Mods** del gioco.
          '@
          gh release create $tag $zip --title "More Mining & Masonry Output $tag" --notes $notes
